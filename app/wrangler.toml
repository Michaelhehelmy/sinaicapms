# Generated by Wrangler on Mon Aug 03 2026 12:03:35 GMT+0300 (Eastern European Summer Time)
name = "campmaster-marketplace"
compatibility_date = "2026-07-08"
compatibility_flags = [ "global_fetch_strictly_public", "nodejs_compat" ]
main = "@astrojs/cloudflare/entrypoints/server"
assets = { directory = "./dist", binding = "ASSETS" }

# ROUTING INTENT (F-A14-8): routes are deliberately NOT declared in this file.
# Production is reached at https://sinaicamps.com and staging at
# https://staging.sinaicamps.com (one host per Worker — the "one-host-one-origin"
# deployment contract). Routes are managed in the Cloudflare dashboard / by the
# deploy script because: (1) the CI deploy token lacks zone permissions
# (`2617e52 fix(ci): use sed to strip routes from wrangler.toml`), and
# (2) `8bbd5f1` taught CI to strip [[routes]] blocks before `wrangler deploy`.
# Do NOT add [[routes]] here unless the deploy token gains zone rights and the
# strip logic in .github/workflows/deploy.yml is removed.

# Service binding to the backend Worker (`campmaster-backend`). SSR API
# fetches go through this binding instead of a same-zone fetch() to
# https://sinaicamps.com/api/*, which Cloudflare rejects with error 1042
# on the root host. Paths are resolved as /api<path> in
# app/src/middleware/tenant.ts (resolveApiFetcher).
[[services]]
binding = "API_BACKEND"
service = "campmaster-backend"

# Staging variant: deploys as `campmaster-marketplace-staging` talking to
# `campmaster-backend-staging`. NOTE: the Astro adapter generates
# dist/server/wrangler.json at build time and wrangler deploys THAT file, so
# [env.staging] here is decorative — deploy.sh patches the generated JSON
# post-build (name + API_BACKEND + SESSION) before `wrangler deploy`.
[env.staging]
name = "campmaster-marketplace-staging"
compatibility_flags = [ "global_fetch_strictly_public", "nodejs_compat" ]

[[env.staging.services]]
binding = "API_BACKEND"
service = "campmaster-backend-staging"
