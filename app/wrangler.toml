# Generated by Wrangler on Mon Aug 03 2026 12:03:35 GMT+0300 (Eastern European Summer Time)
name = "campmaster-marketplace"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-08"

[env.production]
compatibility_flags = [ "global_fetch_strictly_public" ]

# Service binding to the backend Worker (`campmaster-backend`). SSR API
# fetches go through this binding instead of a same-zone fetch() to
# https://sinaicamps.com/api/*, which Cloudflare rejects with error 1042
# on the root host. Paths are resolved as /api<path> in
# app/src/middleware/tenant.ts (resolveApiFetcher).
[[env.production.services]]
binding = "API_BACKEND"
service = "campmaster-backend"
