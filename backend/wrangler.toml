name = "campmaster-backend"
main = "src/index.js"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "sinaicamps.com/api/*"
zone_name = "sinaicamps.com"

[[routes]]
pattern = "*.sinaicamps.com/api/*"
zone_name = "sinaicamps.com"

[[d1_databases]]
binding = "DB"
database_name = "campmaster-db"
database_id = "1008d7ef-c64a-4594-a500-2e09e07e0e12"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "2fde00629aad498380db0c0d3dd7a442"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a805b180d603419fb11eee8c4ed52171"

# R2 media bucket — POST /api/upload writes here; GET /api/media/* streams from it.
# Bucket name read from $R2_BUCKET_NAME (campmaster-media). NOTE: `wrangler r2 bucket list`
# currently shows only `campops-uploads` — campmaster-media must be created in the CF dashboard
# before the worker can store/stream images (tests mock env.MEDIA_BUCKET, so this is non-blocking).
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "campmaster-media"

# Per-tenant SSE broadcast hub (Phase 5). One DO instance per tenant
# (idFromName(tenantId)); SQLite-backed (compatibility_date 2025-07-01+).
[[durable_objects.bindings]]
name = "BROADCASTER"
class_name = "Broadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Broadcaster"]

[vars]
ENVIRONMENT = "production"
# false = use in-memory rate limiting (no KV writes). Re-enable distributed
# KV rate limiting by setting this to "true" once the account's KV write quota
# (free plan: 1,000/day) is no longer exhausted or the plan is upgraded.
RATE_LIMIT_KV_ENABLED = "false"
MAX_LOGIN_ATTEMPTS = "5"
LOCKOUT_DURATION = "1800"
SESSION_TIMEOUT = "86400"
# Phase 5 (opt-in): shorter access-token lifetime for org/POS sessions, in
# seconds. Clamped to [300 .. 86400]; unset keeps the legacy 24h. Leave it
# DISABLED until Phase 6 ships the silent-refresh session kernel — enabling
# it now would strand cashiers mid-shift when the 24h token expires with no
# client-side renewal path.
# POS_ACCESS_TTL_SECONDS = "900"
RATE_LIMIT_LOGIN = "20"
RATE_LIMIT_API = "100"
DEFAULT_CURRENCY = "USD"
DEFAULT_TAX_RATE = "0.08"
LOG_LEVEL = "info"
FEATURE_USER_REGISTRATION = "true"
FEATURE_FORGOT_PASSWORD = "true"
FEATURE_TWO_FACTOR_AUTH = "false"
FEATURE_MULTI_LOCATION = "false"
FEATURE_AI_FEATURES = "false"

# ─────────────────────────────────────────────
# Staging environment (./deploy.sh --staging)
# Isolated resources — never shares prod D1/KV/R2.
# Secrets (JWT_SECRET, etc.) must be set separately:
#   echo "<value>" | npx wrangler secret put JWT_SECRET --env staging
# ─────────────────────────────────────────────
[env.staging.vars]
ENVIRONMENT = "staging"
RATE_LIMIT_KV_ENABLED = "false"
MAX_LOGIN_ATTEMPTS = "5"
LOCKOUT_DURATION = "1800"
SESSION_TIMEOUT = "86400"
# POS_ACCESS_TTL_SECONDS = "900"  # Phase 5 opt-in — see production [vars]
RATE_LIMIT_LOGIN = "20"
RATE_LIMIT_API = "100"
DEFAULT_CURRENCY = "USD"
DEFAULT_TAX_RATE = "0.08"
LOG_LEVEL = "debug"
FEATURE_USER_REGISTRATION = "true"
FEATURE_FORGOT_PASSWORD = "true"
FEATURE_TWO_FACTOR_AUTH = "false"
FEATURE_MULTI_LOCATION = "false"
FEATURE_AI_FEATURES = "false"

[[env.staging.routes]]
pattern = "staging.sinaicamps.com/api/*"
zone_name = "sinaicamps.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "campmaster-db-staging"
database_id = "4a9e6e45-f90d-4897-823b-6dd16dc0f347"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "KV_CACHE"
id = "dd34537ebe534ad89f34f1aec5efde0d"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "72c10646808a47cb997f076da34134eb"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "campmaster-media-staging"

[[env.staging.durable_objects.bindings]]
name = "BROADCASTER"
class_name = "Broadcaster"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Broadcaster"]
