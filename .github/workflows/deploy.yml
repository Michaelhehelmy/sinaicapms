name: Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel deploys in progress

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ─────────────────────────────────────────────
  # Tests must pass before any deploy
  # ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite:
          - name: Backend
            working-directory: backend
            command: npx vitest run
          - name: Frontend
            working-directory: app
            command: npx vitest run
          - name: Integration
            working-directory: .
            command: npx vitest run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: app

      - name: Run ${{ matrix.suite.name }} tests
        working-directory: ${{ matrix.suite.working-directory }}
        run: ${{ matrix.suite.command }}

  # ─────────────────────────────────────────────
  # Deploy Backend Worker + D1 Migrations
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply D1 Migrations
        run: |
          ENV_FLAG=""
          if [ "${{ github.ref_name }}" = "staging" ]; then
            ENV_FLAG="--env staging"
          fi
          echo "y" | npx wrangler d1 migrations apply campmaster-db --remote $ENV_FLAG

      - name: Deploy Worker
        run: |
          ENV_FLAG=""
          if [ "${{ github.ref_name }}" = "staging" ]; then
            ENV_FLAG="--env staging"
          fi
          npx wrangler deploy --minify $ENV_FLAG

      - name: Verify deployment
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            BASE_URL="https://staging.sinaicamps.com"
          else
            BASE_URL="https://sinaicamps.com"
          fi
          echo "Checking $BASE_URL/api/health..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL/api/health" || echo "000")
          if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then
            echo "✅ Backend health check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Backend health check returned HTTP $HTTP_CODE (non-critical)"
          fi

  # ─────────────────────────────────────────────
  # Deploy Frontend to Cloudflare Pages
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: app
        run: npm run build

      - name: Deploy to Pages
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            PROJECT_NAME="campmaster-marketplace-staging"
            BRANCH="staging"
          else
            PROJECT_NAME="campmaster-marketplace"
            BRANCH="main"
          fi
          npx wrangler pages deploy app/dist \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH" \
            --commit-dirty=true

  # ─────────────────────────────────────────────
  # Post-deploy: Run E2E tests against live site
  # ─────────────────────────────────────────────
  e2e-verify:
    name: E2E Verification (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        env:
          BASE_URL: ${{ github.ref_name == 'staging' && 'https://staging.sinaicamps.com' || 'https://sinaicamps.com' }}
        run: |
          echo "Running E2E tests against $BASE_URL..."
          npx playwright test --grep="@smoke" --reporter=list || echo "⚠️ Some E2E tests failed (non-blocking)"

  # ─────────────────────────────────────────────
  # Notify on completion
  # ─────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, e2e-verify]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | ${{ needs.e2e-verify.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "**Staging**: https://staging.sinaicamps.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Production**: https://sinaicamps.com" >> $GITHUB_STEP_SUMMARY
          fi
