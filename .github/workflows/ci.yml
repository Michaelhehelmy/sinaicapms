name: CI — Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Backend Unit Tests
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run vitest with coverage
        run: npm run test:coverage

  # ─────────────────────────────────────────────
  # Frontend Unit Tests
  # ─────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run vitest
        run: npx vitest run

      - name: Build (Astro)
        # PR-level gate: catch compile/asset errors before deploy. Budget and
        # perf enforcement live in budget.json + `npm run lighthouse` (F-A20-01
        # PERF_BASELINE is documentation-only; budget.json is the gate).
        run: npm run build

  # ─────────────────────────────────────────────
  # Root Integration Tests
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: backend

      - name: Run integration tests
        # Explicit config: the root suite must run against the integration config
        # (vitest.integration.config.ts), NOT the default config. The documented
        # /api/auth 30-min login-limit flake makes targeted runs the reliable gate.
        run: npx vitest run --config vitest.integration.config.ts

  # ─────────────────────────────────────────────
  # Backend Lint / OpenAPI check
  # ─────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check OpenAPI spec generation
        # Regenerate from the route registry (source of truth) and FAIL on drift,
        # so a registry change that forgets to regenerate openapi.json breaks CI.
        run: |
          npx vite-node scripts/generate-openapi.js
          git diff --exit-code -- openapi.json

      - name: Gate /api/camps references to the sunset shim
        # Phase 3 rename: /api/camps is a sunset alias (deletion 2026-10-23).
        # Route references (quote-prefixed, so './api/camps' module imports
        # don't trip it) may only live in the alias shim; registry.js stays
        # allowlisted until the companion OpenAPI rename (paths → /api/projects).
        run: |
          ! grep -rn -E "['\"]/api/camps" src | grep -v -e "src/api/camps-alias.js" -e "src/routes/registry.js" || (echo "Stale /api/camps reference outside the sunset shim" && exit 1)
