name = "campmaster-monitor"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = [ "nodejs_compat" ]

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "campmaster-monitor-db"
database_id = "81de335f-a729-4511-a9e8-57a6882c6932"
migrations_dir = "migrations"

[vars]
# No plaintext secrets. Leave empty.

[[routes]]
pattern = "status.sinaicamps.com"
custom_domain = true

# To deploy without the custom domain first:
# comment out the [[routes]] block, deploy to *.workers.dev, test,
# then add the domain later.
