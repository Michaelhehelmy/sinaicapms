name = "campmaster-monitor"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = [ "nodejs_compat" ]

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[triggers]
crons = [ "*/5 * * * *" ]

# NOTE (2026-10-03, phase 6): there is NO relational binding on this worker any
# more, and no `migrations/`. Probe runs, intake reports, alert state, the
# uptime rollup, the per-target history rings AND the per-IP PIN brute-force
# counter are all objects in the single bucket below (`src/storage.js` owns the
# layout). The database that used to hold `checks`/`reports`/`login_attempts`
# still exists in the account — Cloudflare keeps it until somebody deletes it,
# and deleting a Cloudflare resource is the owner's call, not this repo's.
# OWNER ACTION 2 in README.md: deploy, verify one cron cycle, then delete it.
#
# Object storage for the whole worker: probe history, intake reports, and the
# small mutable state documents. One bucket so the retention sweep has a single
# place to look; keys are namespaced by prefix instead of by table:
#   checks/<YYYY-MM-DD>/<HH-MM>.json              one object per cron run
#   reports/<errors|feedback>/<date>/<ts>-<id>.json   one per intake report
#   state/alert_state.json                        per-target alert state
#   state/summary.json                            rolling 24h uptime rollup
#   state/history/<target>.json                   rolling per-target check ring
#   state/login_attempts/<ipHash>.json            per-IP PIN gate counter
# `MONITOR_BUCKET` is the binding name used across src/.
#
# FREE-PLAN COST NOTE: R2 bills storage, and Class A operations (list/write),
# not reads — one cron run is ~8 writes (1 run object + 1 alert state + 1
# summary + 5 rings), so a full day of 5-minute probes is ~2,300 writes against
# the free tier's 1,000,000/month, and the daily sweep is a handful of listings.
# Nothing here touches KV, whose free plan allows only 1,000 writes/day.
[[r2_buckets]]
binding = "MONITOR_BUCKET"
bucket_name = "campmaster-monitor-media"

[vars]
# No plaintext secrets. Leave empty.

[[routes]]
pattern = "status.sinaicamps.com"
custom_domain = true

# B.2 (2026-09-30): explicit /api/* route so status.sinaicamps.com/api/*
# reaches campmaster-monitor. The backend's wildcard
# "*.sinaicamps.com/api/*" (zone sinaicamps.com) otherwise shadows the
# root-path custom-domain route above on /api/* paths only (B.1 verdict:
# Option 2 route shadowing — backend 404 envelope observed on /api/*,
# monitor serves / + /login). Exact-host + path outranks wildcard-host +
# same path (more-specific-wins), so this binding wins for the status host
# without touching backend routes.
[[routes]]
pattern = "status.sinaicamps.com/api/*"
zone_name = "sinaicamps.com"

# To deploy without the custom domain first:
# comment out the [[routes]] block, deploy to *.workers.dev, test,
# then add the domain later.
